
---
- name: Configurar los cinco servidores Ubuntu
  hosts: servidores
  become: true
  gather_facts: true

  tasks:
    - name: Actualizar cache de APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Crear usuario itla
      user:
        name: itla
        state: present
        shell: /bin/bash
        create_home: yes

    - name: Crear carpeta app
      file:
        path: /home/itla/app
        state: directory
        owner: itla
        group: itla
        mode: '0755'

    - name: Crear archivo hola.txt
      copy:
        dest: /home/itla/app/hola.txt
        content: "Hola Mundo desde {{ inventory_hostname }}!"
        owner: itla
        group: itla
        mode: '0644'

    - name: Instalar cowsay y htop
      apt:
        name:
          - cowsay
          - htop
        state: present
